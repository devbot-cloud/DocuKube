
fullnameOverride: ""
nameOverride: ""

replicaCount: 3
image:
  repository: ghcr.io/devbot-cloud/docukube
  pullPolicy: IfNotPresent
  tag: "latest"

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: "250m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "50Mi"

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: nginx.example.com

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

sites: 
  - name: "cluster-api"
  - name: "fluxcd"
  - name: "helm"
  - name: "ingress-nginx"
  - name: "kind"
  - name: "kubebuilder"
  - name: "minikube"
  - name: "rke2"
