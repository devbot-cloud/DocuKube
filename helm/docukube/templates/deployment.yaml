{{- range .Values.sites }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docukube.fullname" $ }}-{{ .name }}
  labels:
    {{- include "docukube.labels" $ | nindent 4 }}
    docukube.devbot.cloud/name: {{ .name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "docukube.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      docukube.devbot.cloud/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "docukube.name" $ }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        docukube.devbot.cloud/name: {{ .name }}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: docukube-{{ .name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}/{{ .name }}:{{ $.Values.image.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
          startupProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
{{- end }}