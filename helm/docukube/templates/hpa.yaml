{{- if .Values.hpa.enabled }}
{{- range .Values.sites }}
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "docukube.fullname" $ }}-{{ .name }}
  labels:
    {{- include "docukube.labels" $ | nindent 4 }}
    docukube.devbot.cloud/name: {{ .name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "docukube.fullname" $ }}-{{ .name }}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
